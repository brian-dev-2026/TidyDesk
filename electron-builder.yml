appId: com.tidydesk.app
productName: TidyDesk
copyright: Copyright © 2026 TidyDesk contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TidyDesk
  artifactName: TidyDesk-Setup-${version}.${ext}
  uninstallDisplayName: TidyDesk
publish:
  provider: github
  owner: brian-dev-2026
  repo: TidyDesk
  releaseType: release
